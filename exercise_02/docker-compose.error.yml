version: '3.8'

services:
  backend:
    image: storex-backend:v2
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    # Lỗi 1: depends_on mặc định chỉ đợi container start, không đợi service sẵn sàng (healthy)

  postgres:
    image: postgres:13
    environment:
      - POSTGRES_DB=storex_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    # Lỗi 2: Thiếu cấu hình volume để lưu trữ dữ liệu bền vững

  redis:
    image: redis:alpine

